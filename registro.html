<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1 class="logo">REGISTRO</h1>

        <!--
            El atributo action="register_process.php" indica a dónde
            se envían los datos cuando el usuario hace clic en "Crear cuenta".
            method="POST" significa que los datos van en el cuerpo de la
            solicitud (no visibles en la URL, más seguro que GET).
        -->
        <form id="registerForm" action="register_process.php" method="POST">
            <input type="text"   name="nombre"        placeholder="Nombre"                  required>
            <input type="text"   name="apellido"       placeholder="Apellido"                required>
            <input type="text"   name="usuario"        placeholder="Nombre de Usuario (Nick)" required>
            <input type="number" name="edad"           placeholder="Edad"  min="13" max="120" required>
            <input type="email"  name="email"          placeholder="Email"                   required>
            <input type="password" id="pass"      name="password"      placeholder="Contraseña"          required>
            <input type="password" id="conf_pass" name="conf_password" placeholder="Confirmar Contraseña" required>

            <button type="submit" class="btn-login">Crear cuenta</button>
        </form>

        <div class="secondary-text">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí.</a>
        </div>
    </div>

    <script src="register_script.js"></script>
</body>
</html>
